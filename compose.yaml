# Local stack, the shape of a deployment: Postgres, Valkey and RustFS, two api replicas (each
# applies pending migrations as it starts, one at a time under an advisory lock) behind Caddy on 127.0.0.1:18080 (UROBOROS_PORT overrides the host port) and two workers.
# `mise run docker:up` builds the real images and starts it. The proxy is the only port this file
# publishes. Everything dev-only (hot reload for the api, loopback ports for Postgres, Valkey and
# RustFS, which `mise run dev:deps` uses for a host-run api and worker) is in compose.dev.yaml.
#
# One project name, so up, down, logs and ps from any directory address the same stack.
name: uroboros

x-server-build: &server-build
  context: .
  target: api
  args:
    VERSION: 0.0.0-compose

# Media storage (docs/downloads.md), shared by the api and the workers. RustFS by default, with
# the bucket the rustfs-init one-shot creates; UROBOROS_STORAGE=filesystem stores organized
# folders on the media-data volume instead (mounted at /media in both).
x-storage-env: &storage-env
  UROBOROS_STORAGE: ${UROBOROS_STORAGE:-s3}
  UROBOROS_S3_ENDPOINT: http://rustfs:9000
  UROBOROS_S3_REGION: ${UROBOROS_S3_REGION:-}
  UROBOROS_S3_BUCKET: uroboros
  UROBOROS_S3_ACCESS_KEY_ID: uroboros
  UROBOROS_S3_SECRET_ACCESS_KEY: uroboros-dev-secret
  UROBOROS_S3_FORCE_PATH_STYLE: "true"
  UROBOROS_S3_PUBLIC_URL: ${UROBOROS_S3_PUBLIC_URL:-}
  UROBOROS_STORAGE_ROOT: /media
  UROBOROS_STORAGE_LAYOUT: ${UROBOROS_STORAGE_LAYOUT:-}
  UROBOROS_MAX_ACTIVE_DOWNLOADS_PER_USER: ${UROBOROS_MAX_ACTIVE_DOWNLOADS_PER_USER:-}
  UROBOROS_MAX_PLAYLIST_ENTRIES: ${UROBOROS_MAX_PLAYLIST_ENTRIES:-}

x-server-env: &server-env
  <<: *storage-env
  DATABASE_URL: postgres://uroboros:uroboros@postgres:5432/uroboros
  VALKEY_URL: redis://valkey:6379
  # Web Push (docs/push.md), passed through from the shell; empty means unset. Push stays off
  # unless UROBOROS_PUBLIC_BASE_URL is https, so the plain-http local stack has it off by default.
  # Without a configured VAPID pair the first replica generates one and both share it.
  UROBOROS_PUBLIC_BASE_URL: ${UROBOROS_PUBLIC_BASE_URL:-}
  UROBOROS_PUSH_SUBJECT: ${UROBOROS_PUSH_SUBJECT:-}
  UROBOROS_VAPID_PUBLIC_KEY: ${UROBOROS_VAPID_PUBLIC_KEY:-}
  UROBOROS_VAPID_PRIVATE_KEY: ${UROBOROS_VAPID_PRIVATE_KEY:-}
  UROBOROS_PUSH_ALLOWED_HOSTS: ${UROBOROS_PUSH_ALLOWED_HOSTS:-}
  # Sign-in (docs/auth.md). Caddy is the proxy in front, so the client IP comes from
  # X-Forwarded-For. A dev-only bootstrap admin, admin / admin, so a fresh stack can be signed
  # into; the weak-password opt-out exists for exactly this and never belongs in production.
  # Override both from the shell. OIDC is off unless its three variables are set (it also needs an https
  # UROBOROS_PUBLIC_BASE_URL for the callback).
  UROBOROS_TRUST_PROXY: "true"
  UROBOROS_SESSION_TTL_HOURS: ${UROBOROS_SESSION_TTL_HOURS:-}
  UROBOROS_LOCAL_LOGIN: ${UROBOROS_LOCAL_LOGIN:-}
  UROBOROS_BOOTSTRAP_USERNAME: ${UROBOROS_BOOTSTRAP_USERNAME:-admin}
  UROBOROS_BOOTSTRAP_PASSWORD: ${UROBOROS_BOOTSTRAP_PASSWORD:-admin}
  UROBOROS_ALLOW_WEAK_BOOTSTRAP_PASSWORD: ${UROBOROS_ALLOW_WEAK_BOOTSTRAP_PASSWORD:-true}
  UROBOROS_OIDC_ISSUER: ${UROBOROS_OIDC_ISSUER:-}
  UROBOROS_OIDC_CLIENT_ID: ${UROBOROS_OIDC_CLIENT_ID:-}
  UROBOROS_OIDC_CLIENT_SECRET: ${UROBOROS_OIDC_CLIENT_SECRET:-}
  UROBOROS_OIDC_DISPLAY_NAME: ${UROBOROS_OIDC_DISPLAY_NAME:-}
  UROBOROS_OIDC_ADMIN_GROUPS: ${UROBOROS_OIDC_ADMIN_GROUPS:-}
  UROBOROS_OIDC_GROUPS_CLAIM: ${UROBOROS_OIDC_GROUPS_CLAIM:-}
  UROBOROS_OIDC_SYNC_INTERVAL_SECS: ${UROBOROS_OIDC_SYNC_INTERVAL_SECS:-}
  UROBOROS_PUSH_MAX_DEVICES: ${UROBOROS_PUSH_MAX_DEVICES:-}
  # The largest request body /api/* accepts (default 65536 bytes).
  UROBOROS_BODY_LIMIT_BYTES: ${UROBOROS_BODY_LIMIT_BYTES:-}
  # How long a stopping api waits for in-flight requests (default 20000 ms).
  UROBOROS_SHUTDOWN_GRACE_MS: ${UROBOROS_SHUTDOWN_GRACE_MS:-}
  # How long a starting api retries an unreachable Postgres, in seconds (default 0: until it
  # answers). The api waits for Postgres to be healthy anyway, so this only matters on a restart.
  UROBOROS_DB_STARTUP_GRACE_SECS: ${UROBOROS_DB_STARTUP_GRACE_SECS:-}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    environment:
      POSTGRES_USER: uroboros
      POSTGRES_PASSWORD: uroboros
      POSTGRES_DB: uroboros
    volumes:
      # PG18 moved PGDATA under /var/lib/postgresql/<major>/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uroboros -d uroboros"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  valkey:
    image: valkey/valkey:8.1.12-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3-compatible object storage for downloaded media: RustFS, S3 API on :9000 and the console on
  # :9001 (the dev overlay publishes them on 127.0.0.1:19000 and :19001). Pinned by version and
  # digest; Renovate bumps both. The credentials are dev-only. The image runs as uid 10001 and owns /data on a fresh volume.
  rustfs:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: uroboros
      RUSTFS_SECRET_KEY: uroboros-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Creates the media bucket once (idempotent: RustFS answers 200 for a bucket that exists), with
  # the RustFS image's own curl signing the request.
  rustfs-init:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        code=$$(curl -s -o /dev/null -w "%{http_code}" -X PUT --aws-sigv4 "aws:amz:us-east-1:s3"
        --user uroboros:uroboros-dev-secret http://rustfs:9000/uroboros);
        case "$$code" in 200|409) exit 0;; *) echo "bucket creation answered $$code"; exit 1;; esac
    depends_on:
      rustfs:
        condition: service_healthy

  api:
    build: *server-build
    image: uroboros:local
    restart: unless-stopped
    deploy:
      replicas: 2
    environment: *server-env
    volumes:
      - media-data:/media
    # Above the api's 20 s drain plus 2 s for cut connections, 2 s cleanup and 2 s hard-exit
    # slack (26 s at most), so compose does not SIGKILL it mid-drain (the default is 10 s).
    stop_grace_period: 30s
    healthcheck:
      # The image is distroless: no shell, no curl. Node's fetch is enough. /api/ready is 503
      # until the replica has migrated; degraded is still HTTP 200, so a stopped Valkey does not
      # take the replicas out.
      test:
        - CMD
        - /usr/local/bin/node
        - -e
        - "fetch('http://127.0.0.1:8080/api/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
      args:
        VERSION: 0.0.0-compose
    image: uroboros:local-worker
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      <<: *storage-env
      DATABASE_URL: postgres://uroboros:uroboros@postgres:5432/uroboros
      VALKEY_URL: redis://valkey:6379
      UROBOROS_WORK_DIR: /work
      UROBOROS_WORKER_CONCURRENCY: ${UROBOROS_WORKER_CONCURRENCY:-}
      # A Netscape cookies file for yt-dlp; mount it and set the path to use one.
      UROBOROS_YTDLP_COOKIES_FILE: ${UROBOROS_YTDLP_COOKIES_FILE:-}
    volumes:
      - media-data:/media
    tmpfs:
      - /work
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  # The one entrypoint, round-robin over both api replicas. `dynamic a` re-resolves the `api`
  # service name every two seconds, so replicas that restart or scale are picked up.
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UROBOROS_PORT:-18080}:8080"
    # Bind-mounted, not a compose `configs: content:` block: compose writes inline configs by
    # copying them into the created container, and on the containerd snapshotter that copy's
    # rootfs mount can still hold the upperdir when the container starts, failing the start with
    # "overlayfs: upperdir is in-use ... device or resource busy" (about 1 in 6 starts here).
    volumes:
      - ./compose/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  rustfs-data:
  media-data:
