apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uroboros.fullname" . }}-api
  labels:
    {{- include "uroboros.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  # A new pod migrates before it reports ready. Taking no old pod down first means a release whose
  # migration fails (its pods exit, never ready) stalls the rollout while the old pods keep serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "uroboros.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uroboros.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $a := .Values.api }}
      {{- /* The api is gone at most 6 s after its grace: 2 s for cut connections, 2 s cleanup, 2 s hard-exit slack. */}}
      {{- if le (int $a.terminationGracePeriodSeconds) (add $a.preStopSleepSeconds $a.shutdownGraceSeconds 6 | int) }}
      {{- fail "api.terminationGracePeriodSeconds must exceed api.preStopSleepSeconds + api.shutdownGraceSeconds by at least 7" }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $a.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "uroboros.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "uroboros.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "uroboros.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # ENTRYPOINT is node and CMD is /app/api.mjs: nothing to override.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "uroboros.databaseEnv" . | nindent 12 }}
            {{- include "uroboros.valkeyEnv" . | nindent 12 }}
            {{- include "uroboros.pushEnv" . | trim | nindent 12 }}
            {{- include "uroboros.authEnv" . | trim | nindent 12 }}
            - name: UROBOROS_BODY_LIMIT_BYTES
              value: {{ $a.bodyLimitBytes | int | quote }}
            - name: UROBOROS_SHUTDOWN_GRACE_MS
              value: {{ mul $a.shutdownGraceSeconds 1000 | quote }}
            - name: UROBOROS_DB_STARTUP_GRACE_SECS
              value: {{ $a.dbStartupGraceSeconds | int | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if gt (int $a.preStopSleepSeconds) 0 }}
          # Holds SIGTERM back until endpoints and the ingress have stopped routing here. The
          # sleep action (Kubernetes >= 1.30, on by default) needs no binary in the distroless image.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $a.preStopSleepSeconds }}
          {{- end }}
          # Liveness is /api/health, which checks no dependency: a database blip must not restart
          # every pod. It answers from the moment the api listens, migrations or not.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness is /api/ready: 503 until migrations ran and the database is attached, then
          # 200 (degraded included, so a dependency blip does not empty the Service).
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            # /api/ready bounds each dependency check at 2 s; the 1 s default would time out
            # during exactly the blip this probe is meant to survive.
            timeoutSeconds: 3
            failureThreshold: 3
          # Holds liveness off while the pod connects and migrates; see api.startupTimeoutSeconds.
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: {{ div (add $a.startupTimeoutSeconds 4) 5 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "uroboros.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "uroboros.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
          # Spread each ReplicaSet on its own, so a rolling update does not count the old pods.
          matchLabelKeys: [pod-template-hash]
      {{- end }}
      {{- end }}
