apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uroboros.fullname" . }}-api
  labels:
    {{- include "uroboros.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uroboros.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uroboros.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "uroboros.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "uroboros.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "uroboros.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # ENTRYPOINT is node and CMD is /app/api.mjs: nothing to override.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "uroboros.databaseEnv" . | nindent 12 }}
            {{- include "uroboros.valkeyEnv" . | nindent 12 }}
            {{- include "uroboros.pushEnv" . | trim | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Liveness is TCP only: /api/health reports dependency state and a database blip must
          # not restart every pod. Readiness uses /api/health, which stays 200 when degraded.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            # /api/health bounds each dependency check at 2 s; the 1 s default would time out
            # during exactly the blip this probe is meant to survive.
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "uroboros.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
