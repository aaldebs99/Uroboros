{{- $a := .Values.api -}}
{{- $pods := ternary $a.hpa.min $a.replicas $a.hpa.enabled -}}
{{- if and $a.pdb.enabled (gt (int $pods) 1) }}
# Keeps one api pod serving through a node drain. Only rendered with more than one pod: with one,
# minAvailable: 1 would block the drain outright.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "uroboros.fullname" . }}-api
  labels:
    {{- include "uroboros.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "uroboros.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
