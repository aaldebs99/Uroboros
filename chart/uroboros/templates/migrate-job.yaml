apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "uroboros.fullname" . }}-migrate
  labels:
    {{- include "uroboros.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  # A pod evicted or preempted (a node drain, say) did not fail on its own: retry it without
  # spending backoffLimit. Exit 2 is a config error: retrying cannot help, so fail the Job at once.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
      - action: FailJob
        onExitCodes:
          containerName: migrate
          operator: In
          values: [2]
  template:
    metadata:
      labels:
        {{- include "uroboros.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Runs before the release's ServiceAccount exists (pre-install), so it uses the namespace
      # default one, with no API token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "uroboros.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "uroboros.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # ENTRYPOINT is node; the same image runs the migrations.
          args: ["/app/migrate.mjs"]
          env:
            {{- include "uroboros.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- include "uroboros.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
