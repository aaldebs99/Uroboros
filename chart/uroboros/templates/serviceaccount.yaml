{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uroboros.serviceAccountName" . }}
  labels:
    {{- include "uroboros.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Kubernetes API access is needed.
automountServiceAccountToken: false
{{- end }}
