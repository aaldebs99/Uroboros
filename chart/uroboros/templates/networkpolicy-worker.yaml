{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uroboros.fullname" . }}-worker
  labels:
    {{- include "uroboros.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- include "uroboros.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Egress
  # The worker accepts no inbound traffic.
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public internet (yt-dlp, public S3 endpoints), never private ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.internetExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    {{- range $dest := list .Values.networkPolicy.postgres .Values.networkPolicy.valkey .Values.networkPolicy.s3 }}
    {{- $rule := include "uroboros.egressDest" (dict "dest" $dest) }}
    {{- if $rule }}
    {{- $rule | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.allowCidrs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      {{- with .ports }}
      ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
