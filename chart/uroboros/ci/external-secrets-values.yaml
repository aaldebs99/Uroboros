# Secrets materialised by External Secrets under non-default keys, with every optional feature on.
image:
  repository: forgejo.example.com/uroboros/uroboros
  tag: 1.2.3
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  workerDigest: sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
imagePullSecrets:
  - name: forgejo-registry
database:
  existingSecret: uroboros-es
  existingSecretKey: postgres-url
valkey:
  existingSecret: uroboros-es
  existingSecretKey: valkey-url
publicBaseUrl: https://uroboros.example.com
push:
  subject: mailto:ops@example.com
  vapid:
    publicKey: BNQsqlL7Krv6nubpS6WsFF_KrCXvGLZkTPFDXMdVGBNee0xFqnUqAcFNYQMwfeObHECMjZ0o5MM8IfJPyTX8KY4
    existingSecret: uroboros-es
    existingSecretKey: vapid-private-key
  allowedHosts: [fcm.googleapis.com, push.apple.com]
  maxDevices: 5
api:
  hpa:
    enabled: false
  replicas: 3
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls:
    - secretName: uroboros-tls
      hosts: [uroboros.example.com]
networkPolicy:
  postgres:
    namespaceSelector:
      kubernetes.io/metadata.name: databases
    podSelector:
      cnpg.io/cluster: uroboros
  valkey:
    podSelector:
      app.kubernetes.io/name: valkey
  s3:
    cidrs: [192.168.1.20/32]
    ports: [9000]
  allowCidrs:
    - cidr: 192.168.1.30/32
      ports: [443]
auth:
  local:
    bootstrap:
      existingSecret: uroboros-es
      usernameKey: bootstrap-username
      passwordKey: bootstrap-password
  oidc:
    issuer: https://sso.example.com/application/o/uroboros/
    clientId: uroboros
    existingSecret: uroboros-es
    clientSecretKey: oidc-client-secret
    adminGroups: ["authentik Admins", "media admins"]
storage:
  kind: s3
  s3:
    endpoint: https://s3.example.com
    bucket: uroboros
    publicUrl: https://s3.example.com
    existingSecret: uroboros-es
    accessKeyIdKey: s3-access-key-id
    secretAccessKeyKey: s3-secret-access-key
worker:
  cookies:
    existingSecret: uroboros-es
    key: ytdlp-cookies
