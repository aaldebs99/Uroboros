database:
  existingSecret: uroboros-database
valkey:
  existingSecret: uroboros-valkey
# The worker policy needs somewhere to reach Postgres and Valkey; these match in-cluster pods.
networkPolicy:
  postgres:
    podSelector:
      app.kubernetes.io/name: postgres
  valkey:
    podSelector:
      app.kubernetes.io/name: valkey
storage:
  kind: s3
  s3:
    endpoint: http://rustfs.storage.svc:9000
    bucket: uroboros
    existingSecret: uroboros-s3
