apiVersion: v2
name: uroboros
description: Uroboros, a self-hosted media downloader. Stateless api replicas that migrate on start, and yt-dlp workers.
type: application
# The chart is versioned with the app: the release commit (scripts/release/lib.sh) stamps both
# lines with the release version, so chart X.Y.Z deploys image X.Y.Z.
version: 0.0.0-dev
# The default image tag.
appVersion: "0.0.0-dev"
# 1.30: the preStop sleep action (beta, on by default from 1.30). Nothing else needs newer.
kubeVersion: ">=1.30.0-0"
