# mise is the single source of truth for toolchains AND tasks — in dev shells and in CI alike.
#
#   Onboard:          mise trust && mise install   (tools, git hooks, blame config, workspace deps)
#   Run a task:       mise run fmt
#   List all tasks:   mise tasks
#
# Every CI step is `run: mise run <task>`, so there is no second copy of any command to keep in
# sync. Task bodies run under `sh` (dash on Debian/Ubuntu runners), so they must be POSIX: no
# `[[ ]]`, no `<(...)`, no `pipefail`.

[tools]
# Exact pins everywhere. Renovate (.renovaterc.json5) bumps them, `mise lock` records the
# resolved URL + checksum per platform in .mise/mise.lock, and CI installs with `--locked`.
#
# node must satisfy package.json `engines.node`; pnpm must equal package.json `packageManager` and
# `devEngines.packageManager` (pnpm re-execs the packageManager version anyway, so a split pin
# means the one here never runs).
node = "24.21.0"
pnpm = "12.12.1"
# Formatter for everything — TS/JS, JSON, Markdown, YAML, TOML, CSS. Honors
# .prettierignore. Distributed only through the npm backend (installed by aube, see [settings.npm]),
# and it runs on node, which is why node above must be mise-managed.
oxfmt = "0.72.0"
# Git hooks; definitions live in .lefthook.toml, installed by the postinstall hook below.
lefthook = "2.2.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
# Fully-qualified so mise never falls back to the registry's `cargo:zizmor` source build.
"aqua:zizmorcore/zizmor" = "1.30.1"
# Renders CHANGELOG.md from conventional commits (cliff.toml). `mise run changelog`.
git-cliff = "2.14.2"
# Chart rendering and manifest validation for the Kubernetes deployment.
helm = "4.3.2"
"aqua:yannh/kubeconform" = "0.8.0"

[settings]
# Maintain .mise/mise.lock: the exact resolved version, download URL and checksum per platform,
# so every machine and every CI runner installs byte-identical toolchains. Load-bearing — CI's
# mise-action adds `--locked` when the lockfile exists, which FAILS rather than resolving when a
# tool is missing from it. After editing [tools], regenerate for every platform and commit:
#
#   mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
#
# (The pre-commit hook runs `mise lock` when this file is staged; it refreshes the platforms
# already present in the lockfile.)
lockfile = true

# Never source-compile node, whatever the machine running `mise lock` prefers. Tool options are
# recorded in the lockfile next to the version and mise matches on them, so a lockfile written on
# a host with a global `node.compile = true` (common on NixOS) does not satisfy CI's request and
# fails with the confusing "node@24.21.0 is not in the lockfile". A project-level setting wins;
# the tool-level `compile` key is ignored while a `[settings.node]` value exists anywhere.
[settings.node]
compile = false

# Install `npm:` tools (oxfmt) with mise's embedded aube, a pnpm-compatible installer, and never
# with `npm install -g`. The default `auto` already means aube, but a global `npm.shell_out = true`
# would silently turn it into npm; naming it here wins over that. Not `"pnpm"`: pnpm 12 global
# installs need mise >= 2026.9.2 (and >= 2026.9.17 for the release-age cutoff to reach pnpm),
# and an older mise fails with "unexpected argument '--global-bin-dir'".
[settings.npm]
package_manager = "aube"

# Runs after `mise install`: installs the git hooks, points `git blame` at
# .git-blame-ignore-revs, and installs the workspace dependencies so the toolchain works
# immediately. All three are idempotent.
#
# Skipped in CI (`CI` or `GITHUB_ACTIONS` set — Forgejo/Gitea runners set GITHUB_ACTIONS too):
# git hooks are meaningless there, and the tasks that need node_modules depend on `install`.
#
# `[hooks]`, not `[settings]`: mise only warns "unknown field" for `settings.postinstall` and
# does nothing, which looks exactly like a hook that ran and found nothing to do.
#
# `enter` closes the gap `postinstall` leaves: postinstall fires only on an explicit `mise install`,
# so a fresh clone whose tools are already cached (they auto-install on `mise run` or via
# `mise activate`) would keep only git's `.sample` hooks. Entering the directory in an activated
# shell installs them; `check-install` keeps every later `cd` silent and write-free.
[hooks]
enter = "[ -n \"${CI:-}${GITHUB_ACTIONS:-}\" ] || lefthook check-install || lefthook install"
postinstall = "[ -n \"${CI:-}${GITHUB_ACTIONS:-}\" ] || { lefthook install && git config blame.ignoreRevsFile .git-blame-ignore-revs && pnpm install --frozen-lockfile; }"

# ── Formatting ────────────────────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Format everything: TS/JS/JSON/MD/YAML/TOML/CSS (oxfmt)"
run = "oxfmt ."

[tasks."fmt:check"]
description = "Check formatting without writing (CI gate)"
# The pre-commit hook auto-formats staged files, so this should never fire for anyone who ran
# `mise install`; it is the backstop for commits made without the hooks.
run = "oxfmt --check ."

# ── Setup helpers ─────────────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install workspace dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

# ── Lint ──────────────────────────────────────────────────────────────────────────────────────

[tasks."lint:workflows"]
description = "actionlint + zizmor over the CI workflows (CI gate)"
# actionlint also shellchecks every `run:` block (shellcheck is on PATH via [tools]).
run = ["actionlint", "zizmor --offline .github/workflows"]

[tasks."lint:shell"]
description = "shellcheck every tracked *.sh file (CI gate)"
# With no shell scripts tracked, "nothing to check" is a pass, not an error.
run = '''
set -eu
if [ -z "$(git ls-files '*.sh')" ]; then
  echo "no tracked *.sh files; nothing to shellcheck"
  exit 0
fi
git ls-files -z '*.sh' | xargs -0 shellcheck
'''

[tasks."lint:renovate"]
description = "Validate .renovaterc.json5 with Renovate's own validator (CI gate)"
# `--no-global`: given a filename, the validator otherwise checks it as SELF-HOSTED global config,
# which accepts/rejects a different set of keys than a repository config.
# Pinned: an unpinned renovate resolves whatever was published a minute ago, which is both a
# supply-chain hole and a way for CI to go red with no commit. The customManager in
# .renovaterc.json5 keeps this version current.
# pnpm, not npx, and run from the repo root on purpose: that is where pnpm-workspace.yaml lives, so
# `pnpm dlx` applies the same `minimumReleaseAge` soak to renovate's transitive dependencies.
# Install scripts are blocked except re2's: without its native build the validator falls back to
# JS RegExp and stops checking regexes the way Renovate runs them.
run = "pnpm dlx --allow-build re2 --package renovate@44.150.1 renovate-config-validator --strict --no-global .renovaterc.json5"

[tasks.changelog]
description = "Render CHANGELOG.md from conventional commits (git-cliff, cliff.toml)"
run = "git-cliff --output CHANGELOG.md"

# ── Ratchets (see docs/ratchets.md) ───────────────────────────────────────────────────────────
# Each ratchet only tightens: exception lists live in tools/ratchet/frozen.json as frozen
# numbers, and a number that improved without being lowered ("slack") fails just like a
# regression. The gates are TypeScript in tools/ratchet, run on node's native type stripping.

[tasks."ratchet:lines"]
description = "Ratchet: no source file over 1000 lines (CI gate)"
depends = ["install"]
run = "pnpm exec ratchet lines"

[tasks."ratchet:complexity"]
description = "Ratchet: cognitive complexity via sonarjs, fn <= 25, file SUM <= 200 (CI gate)"
depends = ["install"]
run = "pnpm exec ratchet complexity"

[tasks."ratchet:suppressions"]
description = "Ratchet: per-file count of eslint-disable and @ts-* suppressions may only fall (CI gate)"
depends = ["install"]
run = "pnpm exec ratchet suppressions"

[tasks."ratchet:pins"]
description = "Ratchet: node/pnpm pins and the 3-day supply-chain soak agree across files (CI gate)"
depends = ["install"]
run = "pnpm exec ratchet pins"

[tasks."ratchet:test"]
description = "Unit tests for the ratchets themselves (CI gate)"
depends = ["install"]
run = "pnpm -F @uroboros/ratchet test"

[tasks.ratchet]
description = "Run every ratchet"
depends = ["ratchet:lines", "ratchet:complexity", "ratchet:suppressions", "ratchet:pins"]

# ── The gate list ─────────────────────────────────────────────────────────────────────────────

[tasks."ci:parity"]
description = "Fail if ci.yml's `mise run` steps and [tasks.ci].depends differ (CI gate)"
depends = ["install"]
run = "pnpm exec ratchet ci-parity"

# ── Local development ─────────────────────────────────────────────────────────────────────────

[tasks."dev:deps"]
description = "Start local Postgres and Valkey (dev/compose.yaml)"
run = "docker compose -f dev/compose.yaml up postgres valkey"

[tasks.migrate]
description = "Apply pending migrations to $DATABASE_URL"
run = "pnpm -F @uroboros/server exec tsx src/migrate/main.ts"
