# git-cliff configuration for the release pipeline (.github/workflows/release-pr.yml and
# scripts/release/) and for `mise run changelog`. The section names, ordering and bump rules
# reproduce what release-please generates.
#
# One thing git-cliff cannot express: a release should only be cut for a releasing commit type
# (feat, fix, perf, revert, deps, breaking), while `--bumped-version` bumps for any conventional
# commit. That gate lives in scripts/release/propose.sh, not here.
#
# Tags are bare semver (`0.3.11`, never `v0.3.11`): `tag_pattern` decides what counts as a release
# and scripts/release/lib.sh reads the same pattern. The links point at the GitHub mirror, a
# constant that needs no API access: a plain mirror keeps every commit hash and tag, so commit and
# compare links resolve there. They never point at the forge, whose domain stays out of the
# repository (ratchet:forge-host). Pull-request numbers are the forge's and mean nothing on
# GitHub, so a "(#140)" reference stays plain text.

[changelog]
# `--prepend` re-emits the header once and inserts the new section directly under it, so it must
# match the first line of CHANGELOG.md exactly.
header = "# Changelog\n\n"
body = """
{%- set repo = "https://github.com/aaldebs99/Uroboros" -%}
{% if version -%}
{% if previous.version -%}
## [{{ version }}]({{ repo }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## [{{ version }}]({{ repo }}/releases/tag/{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% endif -%}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
* {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Merge commits and anything else unparseable are dropped rather than rendered.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
# The "<!-- N -->" prefix is git-cliff's section-ordering trick; the template strips it.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance Improvements" },
  { message = "^refactor", group = "<!-- 03 -->Code Refactoring" },
  { message = "^revert", group = "<!-- 04 -->Reverts" },
  { message = "^docs", group = "<!-- 05 -->Documentation" },
  { message = "^style", group = "<!-- 06 -->Styles" },
  { message = "^test", group = "<!-- 07 -->Tests" },
  { message = "^build", group = "<!-- 08 -->Build System" },
  { message = "^ci", group = "<!-- 09 -->Continuous Integration" },
  { message = "^chore", group = "<!-- 10 -->Miscellaneous Chores" },
  { message = "^deps", group = "<!-- 11 -->Dependencies" },
]

[bump]
# While the major is 0, a feature bumps the patch and a breaking change bumps the minor.
features_always_bump_minor = false
breaking_always_bump_major = false
