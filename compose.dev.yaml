# Dev overlay for compose.yaml: `mise run docker:up:dev`.
#
#   api       the `build` stage of the Dockerfile (node, pnpm and the installed workspace) running
#             `tsx watch`, with apps/server/src and packages/contract/src mounted over the image's
#             copies, so an edit restarts both replicas. Only those two directories are mounted:
#             the image's node_modules stay in place. The SPA it serves is the one built into the
#             image; `mise run dev:ui` (Vite with HMR, proxying /api to :8080) is the UI loop.
#   migrate   reads ./migrations from the host, so a new file applies on the next `up`.
#   host ports on loopback for Postgres (5432), Valkey (6379) and MinIO (9000, console 9001),
#             which `mise run dev:deps` uses for an api and worker run on the host.
#
# The worker is the real worker image: it needs yt-dlp and ffmpeg, which only that image has.
# The dev image is tagged uroboros:dev so it never overwrites the production uroboros:local.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  valkey:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  migrate:
    volumes:
      - ./migrations:/app/migrations:ro

  api:
    build:
      target: build
    image: uroboros:dev
    working_dir: /src/apps/server
    command: ["pnpm", "exec", "tsx", "watch", "src/bin/api.ts"]
    environment:
      UROBOROS_BIND: 0.0.0.0:8080
      UROBOROS_WEB_DIST: /src/apps/web/dist
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./apps/server/src:/src/apps/server/src:ro
      - ./packages/contract/src:/src/packages/contract/src:ro
