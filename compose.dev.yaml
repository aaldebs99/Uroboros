# Dev overlay for compose.yaml: `mise run docker:up:dev`.
#
#   api       the `build` stage of the Dockerfile (node, pnpm and the installed workspace) running
#             `tsx watch`, with apps/server/src and packages/contract/src mounted over the image's
#             copies, so an edit restarts both replicas. Only those two directories are mounted:
#             the image's node_modules stay in place. The SPA it serves is the one built into the
#             image; `mise run dev:ui:docker` (Vite with HMR, proxying /api to this stack's Caddy on
#             :18080) is the UI loop. Plain `dev:ui` proxies to a host-run `dev:api` on :18081.
#   migrate   the same dev image running src/bin/migrate.ts with tsx, reading ./migrations from the
#             host, so a new file applies on the next `up`. It has its own `build:` (the same tag as
#             the api) so it never starts on an image that was not built; COMPOSE_BAKE=false keeps
#             the two builds sequential and the second a cache hit.
#   host ports on loopback for Postgres (15432), Valkey (16379) and RustFS (19000, console
#             19001), which `mise run dev:deps` uses for an api and worker run on the host. Each
#             has an env override (UROBOROS_POSTGRES_PORT, UROBOROS_VALKEY_PORT, UROBOROS_S3_PORT,
#             UROBOROS_S3_CONSOLE_PORT); the container side keeps the services' own ports.
#
# The worker is the real worker image: it needs yt-dlp and ffmpeg, which only that image has.
# The dev image is tagged uroboros:dev so it never overwrites the production uroboros:local.
services:
  postgres:
    ports:
      - "127.0.0.1:${UROBOROS_POSTGRES_PORT:-15432}:5432"

  valkey:
    ports:
      - "127.0.0.1:${UROBOROS_VALKEY_PORT:-16379}:6379"

  rustfs:
    ports:
      - "127.0.0.1:${UROBOROS_S3_PORT:-19000}:9000"
      - "127.0.0.1:${UROBOROS_S3_CONSOLE_PORT:-19001}:9001"

  migrate:
    build:
      target: build
    image: uroboros:dev
    working_dir: /src/apps/server
    command: ["pnpm", "exec", "tsx", "src/bin/migrate.ts"]
    environment:
      UROBOROS_MIGRATIONS_DIR: /src/migrations
    volumes:
      - ./migrations:/src/migrations:ro
      - ./apps/server/src:/src/apps/server/src:ro
      - ./packages/contract/src:/src/packages/contract/src:ro

  api:
    build:
      target: build
    image: uroboros:dev
    working_dir: /src/apps/server
    command: ["pnpm", "exec", "tsx", "watch", "src/bin/api.ts"]
    environment:
      UROBOROS_BIND: 0.0.0.0:8080
      UROBOROS_WEB_DIST: /src/apps/web/dist
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./apps/server/src:/src/apps/server/src:ro
      - ./packages/contract/src:/src/packages/contract/src:ro
