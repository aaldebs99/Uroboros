# Supply-chain soak: refuse to resolve any package version published less than
# 3 days (4320 minutes) ago. This MUST match `minimumReleaseAge: "3 days"` in
# .renovaterc.json5 — otherwise Renovate opens PRs for versions pnpm refuses to
# install. Keep the two in sync.
minimumReleaseAge: 4320

packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm 11+ replaced `onlyBuiltDependencies` with `allowBuilds`, an explicit
# per-package decision map, and an unapproved install script is now a hard error
# (ERR_PNPM_IGNORED_BUILDS). Every entry is a deliberate decision: `true` lets
# that package execute arbitrary code at install time, so justify any flip.
# The esbuild entry stays so a transitive esbuild can never run its install script silently.
allowBuilds:
  esbuild: false
  # testcontainers' transitive ssh2 / cpu-features / protobufjs install scripts only build optional
  # native accelerators (pure-JS fallbacks exist), so they stay denied.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # swagger-ui-dist depends on @scarf/scarf, whose install script reports the download to a
  # telemetry service. The api serves swagger-ui-dist's static files and never runs scarf.
  "@scarf/scarf": false

# Local patches to dependencies, keyed by name so every version gets them and an upgrade the patch
# no longer applies to fails the install instead of silently dropping it.
# - @videojs/react, changes to the Neutral video skin, in both builds (dist/dev and dist/default),
#   none of which has a prop or CSS setting (apps/web/src/library/playerSkin.test.ts checks each
#   applied):
#   - the volume slider opens as soon as the pointer reaches the mute button, not 200 ms later;
#   - a double tap at the sides seeks 10 s by touch only, so on desktop a double-click anywhere is
#     fullscreen (the centre's gesture then covers the whole player), as on YouTube;
#   - the timeline draws the SponsorBlock segments' track as marks;
#   - slots the app fills: the settings menu's Quality submenu (presets/video/settings-slot.js), a
#     button just before settings and a layer over the timeline's marks (controls-slot.js, the
#     Clip button and the clip's range).
patchedDependencies:
  "@videojs/react": patches/@videojs__react.patch
