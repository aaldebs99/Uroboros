---
# Builds and publishes the container image (the Dockerfile's `uroboros` target: the Debian slim
# image with ffmpeg and the pinned yt-dlp, whose one process serves HTTP, runs the download jobs
# and migrates on start) to two registries from one build, so both hold the same digest: the
# forge's, named by the REGISTRY repository variable, and GHCR (ghcr.io/aaldebs99/uroboros, the
# public copy beside the GitHub mirror). Both pushes go to the aaldebs99 namespace and
# authenticate as that user: on the forge with the REGISTRY_TOKEN secret (an access token of
# that account scoped write:package; a Gitea user's package namespace takes pushes from that
# user alone), on GHCR with the GHCR_TOKEN secret (a GitHub personal access token, classic,
# write:packages). Neither is the release bot release-pr.yml cuts releases with.
#
# Nothing in the image may name the forge, because the GHCR copy is public: the source and url
# labels point at the GitHub mirror (metadata-action would derive them from this forge's URL),
# and the build has no provenance attestation (it would record this forge's URLs).
#
#   push to main          -> <REGISTRY>/aaldebs99/uroboros:main and ghcr.io/aaldebs99/uroboros:main (no per-commit tags)
#   published release X.Y.Z (cut by release-pr.yml) -> :X.Y.Z, :X.Y, :latest
#   workflow_dispatch     -> the tags of the ref it runs on (a branch: :<branch>; a tag: :X.Y.Z, :X.Y, :latest)
#
# Every run on a tag ref (the release event, or a manual dispatch on a tag) passes
# scripts/image/smoke-test.sh before any tag is pushed; a push to main publishes :main without it.
#
# Ported from Djinn's release.yml. This is not a CI gate:
# `mise run ci` and ci:parity do not know about it.
# No `permissions:` blocks: Gitea ignores the field and warns about it on every run;
# capabilities come from the forge's Authorized Integrations.
name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  # The forge's registry host, from the repository's Actions variables (never written here: the
  # repository is mirrored to GitHub, and ratchet:forge-host keeps the forge's domain out of it).
  REGISTRY: ${{ vars.REGISTRY }}
  # The public copy, and the GitHub mirror its labels point at.
  GHCR: ghcr.io
  GITHUB_MIRROR: https://github.com/aaldebs99/Uroboros
  # The package namespace: the repository owner's, which only that user may push to (hence the
  # login step's account). Lowercase because OCI repository names must be.
  IMAGE_NAMESPACE: aaldebs99
  IMAGE_NAME: uroboros
  # Add linux/arm64 once a builder for it exists. The ffmpeg mirror image is linux/amd64 only
  # (yt-dlp's linux64 build), so the image needs an arm64 mirror first.
  PLATFORMS: linux/amd64

jobs:
  image:
    name: Image
    # Docker for buildx. The timeout carries 90 extra minutes for the runner's pod wait, as in
    # ci.yml.
    runs-on: big-dind
    timeout-minutes: 150
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the REGISTRY variable and the registry secrets
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          : "${REGISTRY:?the REGISTRY repository variable (registry host) is not set}"
          : "${REGISTRY_TOKEN:?the REGISTRY_TOKEN secret (an aaldebs99 token with write:package) is not set}"
          : "${GHCR_TOKEN:?the GHCR_TOKEN secret (an aaldebs99 GitHub token, classic, with write:packages) is not set}"

      # Some self-hosted runners mount a read-only ~/.docker; log in to a
      # writable config directory instead.
      - name: Writable Docker config
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: aaldebs99
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR }}
          username: aaldebs99
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          # source and url would otherwise be this forge's URL (from github.server_url). On GHCR,
          # the source label also links the package to the mirror.
          labels: |
            org.opencontainers.image.title=uroboros
            org.opencontainers.image.source=${{ env.GITHUB_MIRROR }}
            org.opencontainers.image.url=${{ env.GITHUB_MIRROR }}

      # A release is smoke-tested before anything is pushed: the image is built into the
      # runner's Docker (`load`), scripts/image/smoke-test.sh runs the server and migrate against
      # a throwaway Postgres, and only then does the push step below run, rebuilding
      # from this builder's cache (the same layers, so the pushed image is the one tested). A
      # failure leaves :X.Y.Z and :latest where they were. The :main pushes skip this.
      #
      # Gated on the tag ref, the same condition that turns on the release tags below, not on the
      # event name: a workflow_dispatch run on a tag also pushes :X.Y.Z, :X.Y and :latest, and must
      # be smoked first too. (Djinn's release.yml gates on `github.event_name == 'release'` and has
      # that gap.)
      - name: Build the image for the smoke test
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: uroboros
          platforms: ${{ env.PLATFORMS }}
          load: true
          push: false
          provenance: false
          tags: uroboros:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache

      - name: Smoke test the release image
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/image/smoke-test.sh uroboros:smoke

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: uroboros
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Keep it off: an attestation records the build's git remote and event, this forge's URLs.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Summarise
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          echo "image digest: ${DIGEST}"
          echo "tags:"
          echo "${TAGS}"
